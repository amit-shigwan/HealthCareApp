version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: health_companion
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  miniodata:
